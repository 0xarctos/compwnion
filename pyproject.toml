[project]
name = "compwnion"
version = "0.1.0"
description = "Companion tools for pwn quests"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "capstone>=5.0.9",
    "lief>=1.0.0",
]

[project.optional-dependencies]
# Deep taint analysis for `explore --deep`. Heavy (Triton pulls native wheels),
# so it is opt-in: install with `uv sync --extra deep`.
deep = ["triton-library>=1.0.0rc4"]

[project.scripts]
compwnion = "compwnion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
